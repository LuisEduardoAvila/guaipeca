# Run test suite and linter on push/PR
# Runs on bare-metal GitHub Actions runner (no container)

name: Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev libffi-dev libjpeg-dev poppler-utils antiword

      - name: Install Guaipeca with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint with ruff
        run: ruff check src/

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          HF_HUB_OFFLINE: '0'  # Allow model download for tests