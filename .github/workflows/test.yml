# Run test suite and linter on push/PR
# Runs on bare-metal GitHub Actions runner (no container)

name: Tests

on:
  push:
    # `develop` was never created and is not planned; listing it implied a
    # workflow nobody follows (#48).
    branches: [main]
    # Release tags must be checked too, or the version guard below can never
    # fire: `branches:` alone ignores tag pushes entirely (#45).
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    # No `paths:` filter on PRs, deliberately. A required check that never
    # runs for a docs-only PR leaves it permanently unmergeable, and a PR
    # touching CONTRIBUTING.md or the Dockerfile used to run no tests at all
    # while looking green. Push-to-main keeps its filter; a PR pays the ~3min.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev libffi-dev libjpeg-dev poppler-utils antiword

      - name: Install Guaipeca with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint with ruff
        run: ruff check src/

      # #45: a release tag must equal v + the declared version. Skipped (exit 0)
      # on ordinary pushes and PRs, where there is no tag to check.
      - name: Check tag matches declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/release_check.py "${GITHUB_REF_NAME}"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          HF_HUB_OFFLINE: '0'  # Allow model download for tests