# Build and push multi-arch Guaipeca container image to ghcr.io
# Triggers on push to main when project files change

name: Build Container

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-entrypoint.sh'
      - 'pyproject.toml'
      - '.github/workflows/build-container.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  IMAGE_NAME: ghcr.io/LuisEduardoAvila/guaipeca
  CONTEXT: .

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_lower=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_lower }}:latest
            ${{ steps.meta.outputs.image_lower }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image_lower }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image_lower }}:buildcache,mode=max
          provenance: false