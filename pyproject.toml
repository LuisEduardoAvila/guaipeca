[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guaipeca"
version = "0.5.0"
description = "Lightweight configurable RAG MCP server — FAISS + fastembed + markitdown"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Luis"}]
keywords = ["rag", "mcp", "faiss", "embeddings", "retrieval"]

dependencies = [
    "fastembed>=0.2.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "markitdown>=0.0.1",
    "pymupdf>=1.24.0",
    "bm25s>=0.2.0",
    # Hard pin, deliberately not a range. guaipeca/mcp_sdk/http.py injects our
    # tool Server through MCPServer._lowlevel_server, which is private API with
    # no public equivalent (see issue #25). MCPServer has no __slots__, so on a
    # release that renames that attribute our assignment would still succeed,
    # sse_app() would drive the SDK's own empty server, and /sse would serve
    # zero tools with no error anywhere. Silent capability loss is the failure
    # mode a version range would invite, so a rebuild cannot pull another
    # version in: bump this line on purpose, run the suite, and the runtime
    # guard in _build_sse_app plus the guard tests will catch a moved hook.
    "mcp==2.3.0",
]

[project.optional-dependencies]
all = ["markitdown[all]>=0.0.1", "psutil>=5.9.0"]
pdf = ["markitdown[pdf]>=0.0.1"]
docx = ["markitdown[docx]>=0.0.1"]
pptx = ["markitdown[pptx]>=0.0.1"]
xlsx = ["markitdown[xlsx]>=0.0.1"]
monitor = ["psutil>=5.9.0"]
monitoring = ["psutil>=5.9.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1.0", "psutil>=5.9.0"]

[project.scripts]
guaipeca = "guaipeca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "BLE001",  # Blind except: intentional for server resilience
    "S110",    # try-except-pass: acceptable in cleanup paths
    "TRY004",  # TypeError vs Exception: not worth the churn
    "SIM115",  # Context manager for files: handled with atomic writes
    "G201",    # logging.error vs .exception: intentional choice
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"