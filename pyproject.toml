[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guaipeca"
version = "0.1.0"
description = "Lightweight configurable RAG MCP server — FAISS + fastembed + markitdown"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Luis"}]
keywords = ["rag", "mcp", "faiss", "embeddings", "retrieval"]

dependencies = [
    "fastembed>=0.2.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "markitdown>=0.0.1",
    "pymupdf>=1.24.0",
    "bm25s>=0.2.0",
]

[project.optional-dependencies]
all = ["markitdown[all]>=0.0.1", "psutil>=5.9.0"]
pdf = ["markitdown[pdf]>=0.0.1"]
docx = ["markitdown[docx]>=0.0.1"]
pptx = ["markitdown[pptx]>=0.0.1"]
xlsx = ["markitdown[xlsx]>=0.0.1"]
monitoring = ["psutil>=5.9.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1.0", "psutil>=5.9.0"]

[project.scripts]
guaipeca = "guaipeca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"