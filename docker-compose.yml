# Guaipeca — Docker Compose for VM deployment
# Usage:
#   1. mkdir -p data/{config,corpora,index,models}
#   2. cp config/guaipeca.container.yaml data/config/guaipeca.yaml
#   3. Copy your documents to data/corpora/
#   4. docker compose up -d

services:
  guaipeca:
    image: ghcr.io/luis-eduardo-avila/guaipeca:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guaipeca
    restart: unless-stopped
    ports:
      # Host loopback only. The container listens on 0.0.0.0 *inside* the
      # container; this mapping is what decides who can reach it. Drop the
      # prefix only if you actually want it on every host interface — see
      # docs/network-access-design.md. To reach it from other machines, either
      # publish on a tailnet address ("100.x.y.z:8090:8090") or keep this and
      # tunnel in (ssh -L 8090:127.0.0.1:8090, or `tailscale serve`).
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/data
    environment:
      - GUAIPECA_CONFIG=/data/config/guaipeca.yaml
      # Required: server.host is 0.0.0.0 so the port can be mapped, and the
      # server refuses to start without auth. Set the token in the shell or a
      # .env file next to this compose file; never commit it here.
      #   GUAIPECA_AUTH_TOKEN=<your-token>
      - GUAIPECA_AUTH_TOKEN=${GUAIPECA_AUTH_TOKEN:?set GUAIPECA_AUTH_TOKEN before starting}
    healthcheck:
      # Sends the Bearer token, resolved the same way the server resolves it:
      # GUAIPECA_AUTH_TOKEN from the environment first, then server.auth_token
      # in the config. Without that the probe 401s and reports a working server
      # as unhealthy. See docker-healthcheck.py.
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3